services:
  showlib:
    build: .
    env_file:
      - .env
    environment:
      SHOWLIB_LISTEN_ADDR: 0.0.0.0:8080
      SHOWLIB_DB_PATH: /app/data/${SHOWLIB_DB_FILENAME:-showlib.sqlite}
    ports:
      - "${SHOWLIB_HOST_BIND:-127.0.0.1}:${SHOWLIB_PORT:-8080}:8080"
    volumes:
      - ${SHOWLIB_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
